services:
  chrono-viz:
    image: ${CHRONOLOG_VIZ_IMAGE:-chronolog-viz:4.0.0}
    build:
      context: ../../build/smoke/wheels
      dockerfile: ../../../deploy/containers/viz.Containerfile
    environment:
      CHRONOLOG_CATALOG: chrono-visor:50051
      CHRONOLOG_PLAYER: chrono-player:50054
    ports: ["127.0.0.1:8087:8087"]
    networks:
      chronolog:
        ipv4_address: ${CHRONOLOG_NET_PREFIX:-10.231.77}.205
    extra_hosts:
      - "chrono-visor:${CHRONOLOG_NET_PREFIX:-10.231.77}.201"
      - "chrono-player:${CHRONOLOG_NET_PREFIX:-10.231.77}.204"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      chrono-visor:
        condition: service_healthy
      chrono-player:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/build/venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health', timeout=4).close()"
      start_period: 5s
      interval: 2s
      timeout: 5s
      retries: 30
  grafana:
    image: grafana/grafana:11.6.0
    ports: ["127.0.0.1:3000:3000"]
    extra_hosts:
      - "chrono-viz:${CHRONOLOG_NET_PREFIX:-10.231.77}.205"
    networks: [chronolog]
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: chronolog-viz-datasource
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: chronolog-viz-password
    volumes:
      - ../../build/viz/dist:/var/lib/grafana/plugins/chronolog-viz-datasource:ro
      - ../grafana/viz:/etc/grafana/provisioning/datasources:ro
    depends_on:
      chrono-viz:
        condition: service_healthy
