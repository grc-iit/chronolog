services:
  chrono-viz:
    image: chronolog-viz:4.0.0
    build:
      context: ../../build/smoke/wheels
      dockerfile: ../../../deploy/containers/viz.Containerfile
    environment:
      CHRONOLOG_CATALOG: chrono-visor:50051
      CHRONOLOG_PLAYER: chrono-player:50054
    ports: ["127.0.0.1:8087:8087"]
    networks: [chronolog]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      chrono-visor:
        condition: service_healthy
      chrono-player:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/build/venv/bin/python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8087/health', timeout=4).close()"
      start_period: 5s
      interval: 2s
      timeout: 5s
      retries: 30
  grafana:
    image: grafana/grafana:11.6.0
    networks: [chronolog]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: chronolog-viz-datasource
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: chronolog-viz-password
    volumes:
      - ../../build/viz/dist:/var/lib/grafana/plugins/chronolog-viz-datasource:ro
      - ../grafana/viz:/etc/grafana/provisioning/datasources:ro
    depends_on:
      chrono-viz:
        condition: service_healthy
