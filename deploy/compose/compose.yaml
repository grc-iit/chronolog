# Compose-spec file for podman compose and docker compose, rootless.
# Run from the repository root:
#   podman build -f deploy/containers/builder.Containerfile -t chronolog-builder:local .
#   podman compose -f deploy/compose/compose.yaml up --build --wait
# Visor, Keeper and Player are real services; grapher remains a stub.
# Internal listeners are reachable only on the compose network.

x-chronolog-service: &chronolog-service
  # CI builds chronolog-runtime:local from runtime.Containerfile. The dragon smoke run
  # sets CHRONOLOG_IMAGE to the image it built from natively compiled binaries.
  image: ${CHRONOLOG_IMAGE:-chronolog-runtime:local}
  build:
    context: ../..
    dockerfile: deploy/containers/runtime.Containerfile
    args:
      BUILDER_IMAGE: chronolog-builder:local
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: "no"
  networks: [chronolog]

x-stub-healthcheck: &stub-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${CHRONOLOG_PORT}"]
  interval: 5s
  timeout: 3s
  retries: 10

services:
  chrono-visor:
    <<: *chronolog-service
    environment:
      CHRONOLOG_ROLE: visor
      CHRONOLOG_VISOR_LISTEN: "0.0.0.0:50051"
      CHRONOLOG_VISOR_INTERNAL_LISTEN: "0.0.0.0:50061"
      # The compose network is the cluster interface, so the wildcard bind is deliberate.
      CHRONOLOG_VISOR_INSECURE_BIND_ALL: "true"
      CHRONOLOG_VISOR_DB_PATH: /var/lib/chronolog/catalog.sqlite
      CHRONOLOG_VISOR_KEEPERS: "keeper-1=chrono-keeper:50052"
      CHRONOLOG_VISOR_GRAPHER: "chrono-grapher:50053"
      CHRONOLOG_VISOR_PLAYER: "chrono-player:50054"
    expose: ["50061"]
    ports: ["127.0.0.1:50051:50051"]
    volumes:
      - visor-catalog:/var/lib/chronolog
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50051"]
      interval: 5s
      timeout: 3s
      retries: 10

  chrono-keeper:
    <<: *chronolog-service
    environment:
      CHRONOLOG_ROLE: keeper
      CHRONOLOG_PORT: "50052"
      CHRONOLOG_KEEPER_PROCESS_ID: keeper-1
      CHRONOLOG_KEEPER_INSECURE_BIND_ALL: "true"
      CHRONOLOG_KEEPER_WORKER_THREADS: "4"
      CHRONOLOG_KEEPER_SELF_ENDPOINT: "chrono-keeper:50052"
      CHRONOLOG_KEEPER_LISTEN: "0.0.0.0:50052"
      CHRONOLOG_KEEPER_INTERNAL_LISTEN: "0.0.0.0:50062"
      CHRONOLOG_KEEPER_VISOR_INTERNAL: "chrono-visor:50061"
      CHRONOLOG_KEEPER_WAL_DIR: /var/lib/chronolog/wal
    expose: ["50062"]
    volumes:
      - keeper-wal:/var/lib/chronolog
    depends_on:
      chrono-visor:
        condition: service_healthy
    ports: ["127.0.0.1:50052:50052"]
    healthcheck: *stub-healthcheck

  chrono-grapher:
    <<: *chronolog-service
    environment:
      CHRONOLOG_ROLE: stub
      CHRONOLOG_PORT: "50053"
    healthcheck: *stub-healthcheck

  chrono-player:
    <<: *chronolog-service
    environment:
      CHRONOLOG_ROLE: player
      CHRONOLOG_PORT: "50054"
      CHRONOLOG_PLAYER_PLAYER_ID: player-1
      CHRONOLOG_PLAYER_LISTEN: "0.0.0.0:50054"
      CHRONOLOG_PLAYER_ADVERTISE: "chrono-player:50054"
      CHRONOLOG_PLAYER_VISOR: "chrono-visor:50051"
      CHRONOLOG_PLAYER_VISOR_INTERNAL: "chrono-visor:50061"
      CHRONOLOG_PLAYER_KEEPER_INTERNAL: "keeper-1=chrono-keeper:50062"
    depends_on:
      chrono-visor:
        condition: service_healthy
      chrono-keeper:
        condition: service_healthy
    ports: ["127.0.0.1:50054:50054"]
    healthcheck: *stub-healthcheck

volumes:
  visor-catalog:
  keeper-wal:

networks:
  chronolog:
    driver: bridge
