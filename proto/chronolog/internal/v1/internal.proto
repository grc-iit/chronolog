syntax = "proto3";
package chronolog.internal.v1;
import "chronolog/v1/chronolog.proto";
// Internal only: versioned with release; never gateway-exposed or SDK-generated.
service Archive
{
    // Keeper hot-data snapshot for Player; batches followed by exactly one trailer.
    // INVALID_ARGUMENT for bad range/limit, NOT_FOUND for unknown story,
    // UNAVAILABLE for source failure, UNIMPLEMENTED before port.
    rpc FetchHot(FetchHotRequest) returns (stream FetchHotResponse);

    // Frames all belong to one chunk; reject partial streams or checksum mismatch.
    // TransferChunk: whole-request INVALID_ARGUMENT for malformed input, UNAVAILABLE
    // for service failure, UNIMPLEMENTED before its port. Domain failures remain
    // in ItemStatus where present; fatal stream failures terminate transport.
    rpc TransferChunk(stream TransferChunkRequest) returns (TransferChunkResponse);
    // Grapher reports persisted prefix and unsettled receipts to subscribing Keeper.
    // WatchWatermarks: whole-request INVALID_ARGUMENT for malformed input, UNAVAILABLE
    // for service failure, UNIMPLEMENTED before its port. Domain failures remain
    // in ItemStatus where present; fatal stream failures terminate transport.
    rpc WatchWatermarks(WatchWatermarksRequest) returns (stream WatchWatermarksResponse);
    // I6.22: Keeper writer checkpoint head and recorded sequence result, for the Player's Await (I6.20).
    // INVALID_ARGUMENT for malformed input, UNAVAILABLE for source failure, UNIMPLEMENTED before port;
    // a Keeper that never held the incarnation answers known=false.
    rpc WriterStatus(WriterStatusRequest) returns (WriterStatusResponse);
}
service Cluster
{
    rpc ExtendCeiling(ExtendCeilingRequest) returns (ExtendCeilingResponse);
    rpc DrainKeeper(DrainKeeperRequest) returns (DrainKeeperResponse);
    rpc JoinKeeper(JoinKeeperRequest) returns (JoinKeeperResponse);
    rpc AbandonKeeper(AbandonKeeperRequest) returns (AbandonKeeperResponse);
    rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
    // Visor distributes writer registration and release fences to assigned Keeper.
    // INVALID_ARGUMENT for empty keeper id, UNAVAILABLE for service failure,
    // UNIMPLEMENTED before port. Stream cancellation uses CANCELLED.
    rpc WatchAcquisitions(WatchAcquisitionsRequest) returns (stream WatchAcquisitionsResponse);

    // Cluster skew observability: bracket with local monotonic t0/t1 and use
    // offset = authority_tick_ns + RTT/2 - t1. Physical bound remains separate.
    // INVALID_ARGUMENT for malformed input; UNAVAILABLE for source/service
    // failure; UNIMPLEMENTED until clock exchange is ported. Never SDK-exposed.
    rpc ReadClock(ReadClockRequest) returns (ReadClockResponse);

    // Register: whole-request INVALID_ARGUMENT for malformed input, UNAVAILABLE
    // for service failure, UNIMPLEMENTED before its port. Domain failures remain
    // in ItemStatus where present; fatal stream failures terminate transport.
    rpc Register(RegisterRequest) returns (RegisterResponse);
    // Heartbeat: whole-request INVALID_ARGUMENT for malformed input, UNAVAILABLE
    // for service failure, UNIMPLEMENTED before its port. Domain failures remain
    // in ItemStatus where present; fatal stream failures terminate transport.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    // Full snapshots on subscribe/reconnect. Epochs are static in static membership mode and change only under
    // I4.7 to I4.15 in dynamic mode.
    // WatchRoutes: whole-request INVALID_ARGUMENT for malformed input, UNAVAILABLE
    // for service failure, UNIMPLEMENTED before its port. Domain failures remain
    // in ItemStatus where present; fatal stream failures terminate transport.
    rpc WatchRoutes(WatchRoutesRequest) returns (stream WatchRoutesResponse);
}
message ChunkIdentity
{
    // chunk id; interpreted according to the message invariants above.
    string chunk_id = 1;
    // Catalog-assigned uint64 story identity; never a hash of concatenated names.
    uint64 story_id = 2;
    // start; interpreted according to the message invariants above.
    chronolog.v1.Hlc start = 3;
    // end; interpreted according to the message invariants above.
    chronolog.v1.Hlc end = 4;
    // Salvage chunk is readable but never advances contiguous watermark.
    bool watermark_exempt = 5;
    bool physical_policy = 6;
}
// data is a serialized ChunkPayload sliced into bounded frames; offsets gapless.
// Every frame repeats identical identity/total_bytes/checksum/algorithm.
// Unspecified algorithm defaults to CHECKSUM_ALGORITHM_CRC32C via absl/crc/crc32c.h. CHECKSUM_ALGORITHM_CRC32C is
// exactly four bytes, unsigned big-endian, and covers all concatenated data. CHECKSUM_ALGORITHM_SHA256 is
// reserved: no sender implements it and the Grapher refuses it with INVALID_ARGUMENT (W10.4).
// final must match byte count and stream EOF.
enum ChecksumAlgorithm
{
    // Means CHECKSUM_ALGORITHM_CRC32C, never unchecked.
    CHECKSUM_ALGORITHM_UNSPECIFIED = 0;
    // Castagnoli CRC via absl::ComputeCrc32c: four unsigned big-endian bytes.
    CHECKSUM_ALGORITHM_CRC32C = 1;
    // Reserved, not implemented: the Grapher refuses it (W10.4).
    CHECKSUM_ALGORITHM_SHA256 = 2;
}
message ChunkFrame
{
    // Absent/unspecified means CHECKSUM_ALGORITHM_CRC32C.
    ChecksumAlgorithm checksum_algorithm = 7;
    // identity; interpreted according to the message invariants above.
    ChunkIdentity identity = 1;
    // Gapless byte offset into serialized ChunkPayload, starting at zero.
    uint64 offset = 2;
    // Total concatenated ChunkPayload size in bytes; identical in every frame.
    uint64 total_bytes = 3;
    // Checksum bytes in the encoding specified above.
    bytes checksum = 4;
    // data; interpreted according to the message invariants above.
    bytes data = 5;
    // True only on last data frame; EOF must follow and total byte count must match.
    bool final = 6;
}
message ChunkPayload
{
    // events; interpreted according to the message invariants above.
    repeated chronolog.v1.Event events = 1;
}
// Delivery receipt is NOT client DURABLE ack; it scopes settlement to one Grapher
// restart instance. Bytes must equal transmitted total; receipt numbers never
// repeat within instance, including story destruction/recreation.
message ChunkReceipt
{
    // Result status, or synchronization state for a physical time reading.
    chronolog.v1.ItemStatus status = 1;
    // chunk id; interpreted according to the message invariants above.
    string chunk_id = 2;
    // Exact byte count received for the whole chunk.
    uint64 bytes = 3;
    // Restart-specific Grapher identity scoping receipt numbering.
    string grapher_instance = 4;
    // Monotonic receipt number within grapher_instance; zero means no tracked receipt.
    uint64 receipt = 5;
}
message WatermarkSubscription
{
    // keeper id; interpreted according to the message invariants above.
    string keeper_id = 1;
    // story ids; interpreted according to the message invariants above.
    repeated uint64 story_ids = 2;
}
// Up to highest_receipt all are written except pending_receipts (sorted).
// Receipt settles only after merge and all holding chunks publish; W alone
// never proves a late/salvage chunk written. dropped is explicit, not a time.
message WatermarkReport
{
    // Catalog-assigned uint64 story identity; never a hash of concatenated names.
    uint64 story_id = 1;
    // Contiguous persisted HLC prefix; alone cannot settle pending receipts.
    chronolog.v1.Hlc watermark = 2;
    // Restart-specific Grapher identity scoping receipt numbering.
    string grapher_instance = 3;
    // Inclusive highest issued receipt; zero if none issued.
    uint64 highest_receipt = 4;
    // Ascending receipt numbers whose events have not all been persisted.
    repeated uint64 pending_receipts = 5;
    // Explicit story tombstone indication; not a timestamp sentinel.
    bool dropped = 6;
}
enum ProcessRole
{
    PROCESS_ROLE_UNSPECIFIED = 0;
    PROCESS_ROLE_KEEPER = 1;
    PROCESS_ROLE_GRAPHER = 2;
    PROCESS_ROLE_PLAYER = 3;
}
// process_id stable; instance changes on restart to fence delayed heartbeats.
message Process
{
    // Stable process registration identity, independent of endpoint.
    string process_id = 1;
    // Restart-specific process identity used to fence old heartbeats.
    string instance = 2;
    // Network endpoint for the registered process.
    string endpoint = 3;
    // role; interpreted according to the message invariants above.
    ProcessRole role = 4;
}
message RegisterRequest
{
    // process; interpreted according to the message invariants above.
    Process process = 1;
    string recovered_instance = 2;
    uint64 policy_version = 3;
}
message RegisterResponse
{
    chronolog.v1.Hlc ceiling_floor = 5;
    int64 physical_ceiling_floor_ns = 6;
    repeated string visor_replicas = 7;
    MembershipPolicy policy = 8;
    // Result status, or synchronization state for a physical time reading.
    chronolog.v1.ItemStatus status = 1;
    // routes; interpreted according to the message invariants above.
    repeated RouteUpdate routes = 2;
    // Writer CLOCK_REALTIME reading plus bound/status; independent of Visor monotonic tick.
    chronolog.v1.TimeReading physical = 3;
    // Visor monotonic tick in nanoseconds captured at service time, not CLOCK_REALTIME.
    int64 authority_tick_ns = 4;
    // Visor that generated physical and authority_tick_ns; a forwarder preserves it.
    ClockResponder clock_responder = 9;
}
message StoryFrontiers
{
    SettlementProof settlement = 4;
    chronolog.v1.Hlc evicted_below = 5;
    string drained_instance = 6;
    uint64 drained_epoch = 7;
 // Catalog-assigned story.
 uint64 story_id = 1;
 // Writer diagnostics for this story.
 repeated chronolog.v1.WriterFrontier frontiers = 2;
 // Keeper-level seal, including writerless stories.
 chronolog.v1.Hlc sealed_frontier = 3;
}
message AcquisitionAdmissionEvidence
{
    // One coalesced tuple per OK new-sequence admission since heartbeat attempt.
    uint64 story_id = 1;
    uint64 writer_id = 2;
    uint64 incarnation = 3;
}
message HeartbeatRequest
{
    // Bounded new-admission evidence, validated against current instance/assignment.
    // Consume before early return; strip before any proposal. Never replay a drained set.
    repeated AcquisitionAdmissionEvidence admission_evidence = 8;
    repeated uint64 stories_without_physical_policy = 7;
    uint64 applied_route_revision = 6;
 // Relevant updates <= R applied; irrelevant global revisions skipped. Scoped
 // to process instance. Counter originates in persisted Catalog and never reuses.
 uint64 applied_revision = 5;
 // Stable registered process identity.
 string process_id = 1;
 // Restart-specific instance fences obsolete reports.
 string instance = 2;
 // A Keeper can serve multiple stories; seals never mix story identities.
 repeated StoryFrontiers story_frontiers = 3;
}
// Clock exchange uses same Visor authority semantics as Cluster.ReadClock.
message HeartbeatResponse
{
    // Result status, or synchronization state for a physical time reading.
    chronolog.v1.ItemStatus status = 1;
    // routes; interpreted according to the message invariants above.
    repeated RouteUpdate routes = 2;
    // Writer CLOCK_REALTIME reading plus bound/status; independent of Visor monotonic tick.
    chronolog.v1.TimeReading physical = 3;
    // Visor monotonic tick in nanoseconds captured at service time, not CLOCK_REALTIME.
    int64 authority_tick_ns = 4;
    // Visor that generated physical and authority_tick_ns; a forwarder preserves it.
    ClockResponder clock_responder = 5;
}
message RouteSubscription
{
    // Stable process registration identity, independent of endpoint.
    string process_id = 1;
    // Restart-specific process identity used to fence old heartbeats.
    string instance = 2;
}
message RouteUpdate
{
    chronolog.v1.Hlc ordering_cut = 4;
    int64 physical_floor_ns = 5;
    repeated Predecessor predecessors = 6;
    chronolog.v1.Hlc archived_below = 7;
    repeated chronolog.v1.HlcRange abandoned = 8;
    repeated string observe_floor = 9;
    bool physical_policy = 10;

    uint64 revision = 3;
    // Catalog-assigned uint64 story identity; never a hash of concatenated names.
    uint64 story_id = 1;
    // route; interpreted according to the message invariants above.
    chronolog.v1.Route route = 2;
    // Story destroyed at this revision; no route follows (W10.17).
    bool tombstoned = 11;
}

// Identity of the Visor replica process that generated a clock reading.
message ClockResponder
{
    string replica_id = 1;
    string instance = 2;
}
message ReadClockRequest
{
    // True: the addressed replica answers with its own reading, without forwarding or a lease.
    // False: a dynamic follower forwards to the leader.
    bool audit_local_replica = 1;
}
// authority_tick_ns is Visor steady-clock tick at service time, not realtime.
// Physical uncertainty comes from chrony/kernel: delay/2+dispersion+drift*age.
message ReadClockResponse
{
    // Writer CLOCK_REALTIME reading plus bound/status; independent of Visor monotonic tick.
    chronolog.v1.TimeReading physical = 1;
    // Visor monotonic tick in nanoseconds captured at service time, not CLOCK_REALTIME.
    int64 authority_tick_ns = 2;
    // Visor that generated physical and authority_tick_ns; a forwarder preserves it.
    ClockResponder clock_responder = 3;
}

// Internal hot replay uses the same half-open HLC/physical range representation.
message FetchHotRequest
{
    chronolog.v1.PhysicalRange physical_filter = 7;
    string expect_instance = 5;
    uint64 expect_epoch = 6;
    // Catalog-assigned story identity.
    uint64 story_id = 1;
    // Exactly one range must be selected.
    oneof range
    {
        chronolog.v1.HlcRange hlc = 2;
        // Physical-axis scan; the source applies the interval test of I6.10 and the Player decides completeness.
        chronolog.v1.PhysicalRange physical = 3;
    }
    // Maximum events to return; zero means server-configured default limit.
    uint64 max_events = 4;
    // I6.17: the source returns only matching events and counts matches toward max_events; it never changes the frontier.
    chronolog.v1.Predicate predicate = 8;
    // I6.18: NEWEST_FIRST makes the source scan the range in descending ReplayLess order; UNSPECIFIED is oldest-first.
    chronolog.v1.ReadOrder order = 9;
}
// I6.22, I6.20: one writer incarnation and one sequence the Player asks about.
message WriterStatusRequest
{
    // I6.22: Catalog-assigned story identity.
    uint64 story_id = 1;
    // I6.22: writer identity of the awaited EventId.
    uint64 writer_id = 2;
    // I6.22: incarnation of the awaited EventId.
    uint64 incarnation = 3;
    // I6.22: sequence of the awaited EventId.
    uint64 sequence = 4;
    // I6.22: Keeper instance the Player expects, as FetchHotRequest.expect_instance.
    string expect_instance = 5;
    // I6.22: Route epoch the Player expects, as FetchHotRequest.expect_epoch.
    uint64 expect_epoch = 6;
}
// I6.22: answered from the checkpoint head and dedupe window, which survive release, eviction and restart.
message WriterStatusResponse
{
    // I6.22: false when this Keeper never held the incarnation; the Player then answers unknown (I6.20).
    bool known = 1;
    // I6.22: next sequence the Keeper expects from the incarnation.
    uint64 next_sequence = 2;
    // I6.22: hlc of the incarnation's last accepted event; absent when it accepted none.
    chronolog.v1.Hlc last_hlc = 3;
    // I6.22: the incarnation is released, expired or superseded.
    bool released = 4;
    // I6.22: original terminal cause; UNSPECIFIED while the incarnation is live.
    chronolog.v1.AcquisitionTerminationCause termination_cause = 5;
    // I6.22: result of the requested sequence while it lies inside the dedupe window; unset below it or at and above next_sequence.
    oneof recorded
    {
        // I6.22: the sequence was accepted with this hlc.
        chronolog.v1.Hlc recorded_hlc = 6;
        // I6.22: the sequence was consumed by this recorded rejection (I8.9).
        chronolog.v1.ItemStatus recorded_rejection = 7;
    }
    // I6.22: Keeper-level sealed frontier F, the certificate of answer (2) in I6.20.
    chronolog.v1.Hlc sealed_frontier = 8;
    // I6.22: Keeper instance that answered.
    string instance = 9;
    // I6.22: Keeper epoch that answered; a mismatch with the Player's Route is SOURCE_FAILED (I6.11).
    uint64 epoch = 10;
}
message FetchHotTrailer
{
    optional int64 physical_frontier_ns = 7;
    string instance = 6;
 // Current Keeper epoch; mismatch with Player Route is SOURCE_FAILED.
 uint64 epoch = 4;
    // Keeper-level sealed F even if no writers are known; completeness is over
    // every Route Keeper, independent of the acquisition view.
    chronolog.v1.Hlc sealed_frontier = 3;
    // Shared Keeper-sealed exclusive frontier for every registered writer; idle
    // writers use the same frontier. A missing writer never implies completeness.
    repeated chronolog.v1.WriterFrontier frontiers = 1;
    // True if the limit prevented a full snapshot; Replay remains incomplete.
    bool truncated = 2;
    // Eviction floor E of this Keeper for the story: events with hlc below it may
    // have left Keeper RAM, and only after their chunk's receipt settled. Every
    // event at or above it is still served here. Zero when nothing was freed.
    // Survives Keeper restart. The Player reads the archive over [start, max E).
    chronolog.v1.Hlc evicted_below = 5;
}
message FetchHotResponse
{
    // Tick the frontier BEFORE scanning, then lock each writer to await in-flight
    // insertion. Group commit caps F at the oldest pending fsync HLC.
    // Data snapshot must cover every visible event below the trailer's seal.
    // Seal and snapshot must be coordinated with insertion/fsync publication.
    oneof response
    {
        // Ordered visible events; pending DURABLE events are excluded.
        chronolog.v1.EventBatch batch = 1;
        // Exactly one final trailer on successful orderly stream termination.
        FetchHotTrailer trailer = 2;
    }
}
message AcquisitionSnapshot {
 // Persisted global Catalog counter bounding a consistent full snapshot.
 uint64 revision = 1;
 // All relevant acquisitions AND release fences for the subscribed Keeper.
 repeated AcquisitionUpdate acquisitions = 2;
}
message AcquisitionResponse {
 // Exactly one full snapshot first, followed by ordered deltas above its R.
 oneof response {
  AcquisitionSnapshot snapshot = 1;
  AcquisitionUpdate update = 2;
 }
}
message AcquisitionSubscription
{
    // Stable Keeper registration identity.
    string keeper_id = 1;
}
enum AcquisitionState
{
    // Invalid for a delivered acquisition update.
    ACQUISITION_STATE_UNSPECIFIED = 0;
    // Writer incarnation is registered and authorized to append.
    ACQUISITION_STATE_ACQUIRED = 1;
    // Writer incarnation is permanently fenced from future append.
    ACQUISITION_STATE_RELEASED = 2;
}
// Subscribe/reconnect delivers full snapshot at revision R, then deltas > R.
// Keeper restores all fences from snapshot BEFORE admitting any append.
message AcquisitionUpdate
{
    // Original terminal cause; never relabel a terminal tuple on later Release.
    chronolog.v1.AcquisitionTerminationCause termination_cause = 8;
    // Persisted global Catalog revision, never reused across Visor restarts.
    // Keeper reports applied_revision after applying relevant updates, and
    // heartbeats immediately after RELEASED rather than waiting for interval.
    uint64 revision = 7;
    // M8 handoff: new Keeper must observe this old Keeper frontier before
    // accepting the reassigned writer. Absent means no prior reported frontier.
    chronolog.v1.Hlc last_reported_frontier = 6;
    // Catalog-assigned story identity.
    uint64 story_id = 1;
    // Stable writer identity.
    uint64 writer_id = 2;
    // Persisted writer generation.
    uint64 incarnation = 3;
    // Single Keeper endpoint assigned to this writer in the epoch.
    chronolog.v1.KeeperRef assigned_keeper = 4;
    // Registration or permanent release fence for this incarnation.
    AcquisitionState state = 5;
}

// Method-specific TransferChunk message; same payload invariants as ChunkFrame.
message TransferChunkRequest {
    // Absent/unspecified means CHECKSUM_ALGORITHM_CRC32C.
    ChecksumAlgorithm checksum_algorithm = 7;
    // identity; interpreted according to the message invariants above.
    ChunkIdentity identity = 1;
    // Gapless byte offset into serialized ChunkPayload, starting at zero.
    uint64 offset = 2;
    // Total concatenated ChunkPayload size in bytes; identical in every frame.
    uint64 total_bytes = 3;
    // Checksum bytes in the encoding specified above.
    bytes checksum = 4;
    // data; interpreted according to the message invariants above.
    bytes data = 5;
    // True only on last data frame; EOF must follow and total byte count must match.
    bool final = 6;
}
// Method-specific TransferChunk message; same payload invariants as ChunkReceipt.
message TransferChunkResponse {
    // Result status, or synchronization state for a physical time reading.
    chronolog.v1.ItemStatus status = 1;
    // chunk id; interpreted according to the message invariants above.
    string chunk_id = 2;
    // Exact byte count received for the whole chunk.
    uint64 bytes = 3;
    // Restart-specific Grapher identity scoping receipt numbering.
    string grapher_instance = 4;
    // Monotonic receipt number within grapher_instance; zero means no tracked receipt.
    uint64 receipt = 5;
}
// Method-specific WatchWatermarks message; same payload invariants as WatermarkSubscription.
message WatchWatermarksRequest {
    // keeper id; interpreted according to the message invariants above.
    string keeper_id = 1;
    // story ids; interpreted according to the message invariants above.
    repeated uint64 story_ids = 2;
}
// Method-specific WatchWatermarks message; same payload invariants as WatermarkReport.
message WatchWatermarksResponse {
    // Catalog-assigned uint64 story identity; never a hash of concatenated names.
    uint64 story_id = 1;
    // Contiguous persisted HLC prefix; alone cannot settle pending receipts.
    chronolog.v1.Hlc watermark = 2;
    // Restart-specific Grapher identity scoping receipt numbering.
    string grapher_instance = 3;
    // Inclusive highest issued receipt; zero if none issued.
    uint64 highest_receipt = 4;
    // Ascending receipt numbers whose events have not all been persisted.
    repeated uint64 pending_receipts = 5;
    // Explicit story tombstone indication; not a timestamp sentinel.
    bool dropped = 6;
}
// Method-specific WatchAcquisitions message; same payload invariants as AcquisitionSubscription.
message WatchAcquisitionsRequest {
    // Stable Keeper registration identity.
    string keeper_id = 1;
}
// Method-specific WatchAcquisitions message; same payload invariants as AcquisitionResponse.
message WatchAcquisitionsResponse {
 // Exactly one full snapshot first, followed by ordered deltas above its R.
 oneof response {
  AcquisitionSnapshot snapshot = 1;
  AcquisitionUpdate update = 2;
 }
}
// Method-specific WatchRoutes message; same payload invariants as RouteSubscription.
message WatchRoutesRequest {
    // Stable process registration identity, independent of endpoint.
    string process_id = 1;
    // Restart-specific process identity used to fence old heartbeats.
    string instance = 2;
}
// Method-specific WatchRoutes message; same payload invariants as RouteUpdate.
message WatchRoutesResponse
{
    chronolog.v1.Hlc ordering_cut = 4;
    int64 physical_floor_ns = 5;
    repeated Predecessor predecessors = 6;
    chronolog.v1.Hlc archived_below = 7;
    repeated chronolog.v1.HlcRange abandoned = 8;
    repeated string observe_floor = 9;
    bool physical_policy = 10;

    uint64 revision = 3;
    // Catalog-assigned uint64 story identity; never a hash of concatenated names.
    uint64 story_id = 1;
    // route; interpreted according to the message invariants above.
    chronolog.v1.Route route = 2;
    // Story destroyed at this revision; no route follows (W10.17).
    bool tombstoned = 11;
    // Exactly one message with snapshot_end=true follows the snapshot entries and
    // precedes every delta; it carries revision = R, story_id 0 and no route.
    bool snapshot_end = 12;
}

message ExpireAcquisitions
{
    // Authority-selected due tuples, revalidated current/unreleased at apply.
    // No clock, deadline, or authority generation is carried in the log.
    repeated chronolog.v1.RenewAcquisition acquisitions = 1;
}
message AcquisitionFenceObservation
{
    chronolog.v1.RenewAcquisition acquisition = 1;
    string owner_process_id = 2;
    // Currently registered instance; registration alone is not fence proof.
    string owner_instance = 3;
    uint64 release_revision = 4;
    uint64 applied_revision = 5;
}
message AcquireCommand
{
    // Only validated public options; every other member is authority-selected.
    chronolog.v1.AcquireRequest request = 1;
    // Presence distinguishes no predecessor from a carried incarnation.
    optional uint64 prior_incarnation = 2;
    // Resolved once at proposal; replicas neither re-clamp nor sample clocks.
    int64 lease_duration_ns = 3;
    chronolog.v1.Route route = 4;
    chronolog.v1.KeeperRef assigned_keeper = 5;
    repeated chronolog.v1.RenewAcquisition due_acquisitions = 6;
    repeated AcquisitionFenceObservation fence_observations = 7;
    optional chronolog.v1.KeeperPreferenceResult keeper_preference = 8;
}
// I6.16: createStory in dynamic mode. Apply computes the creation floor pair from the applied Catalog state
// (the maximum C and the maximum CP over every ceiling pair ever granted) in the same transaction that
// creates the story, and refuses with FAILED_PRECONDITION while a registered Keeper has no ceiling.
// The command never carries the floor: a value read at proposal can miss a ceiling granted before commit.
message CreateStoryCommand
{
    // I6.16: the validated public request, properties included (I9.2).
    chronolog.v1.CreateStoryRequest request = 1;
}
message DestroyStoryCommand
{
    chronolog.v1.DestroyStoryRequest request = 1;
    // Complete authority-selected due set; expiry commits even if destroy refuses.
    repeated chronolog.v1.RenewAcquisition due_acquisitions = 2;
    repeated AcquisitionFenceObservation fence_observations = 3;
}
message DestroyChronicleCommand
{
    chronolog.v1.DestroyChronicleRequest request = 1;
    // Complete due set for all contained stories; no partial chronicle tombstone.
    repeated chronolog.v1.RenewAcquisition due_acquisitions = 2;
    repeated AcquisitionFenceObservation fence_observations = 3;
}
message CatalogCommand
{
    oneof mutation
    {
        ExpireAcquisitions expire_acquisitions = 9;
        AcquireCommand acquire_with_lease = 10;
        DestroyStoryCommand destroy_story_with_leases = 11;
        DestroyChronicleCommand destroy_chronicle_with_leases = 12;
        MembershipCommand membership = 8;
        // I6.16: createStory whose apply computes the dynamic-mode creation floor; create_story stays so existing logs apply as they did.
        CreateStoryCommand create_story_with_floor = 13;
  chronolog.v1.CreateChronicleRequest create_chronicle = 1;
  chronolog.v1.DestroyChronicleRequest destroy_chronicle = 2;
  chronolog.v1.CreateStoryRequest create_story = 3;
  chronolog.v1.DestroyStoryRequest destroy_story = 4;
  chronolog.v1.AcquireRequest acquire = 5;
  chronolog.v1.ReleaseRequest release = 6;
  chronolog.v1.CompareAndSetEpochRequest compare_and_set_epoch = 7;
 }
}

message MembershipPolicy
{
    int64 ceiling_ahead_ns = 1;
    int64 physical_ahead_ns = 2;
    int64 acceptance_budget_ns = 3;
    int64 hlc_budget_ns = 4;
    uint64 version = 5;
    int64 acceptance_window_ns = 6;
    int64 skew_limit_ns = 7;
    int64 hlc_lead_ns = 8;
    int64 uncertainty_cap_ns = 9;
    // The Visor's Keeper liveness timeouts; Keepers take them from here so the two sides cannot drift.
    uint32 keeper_failure_timeout_ms = 10;
    uint32 release_fence_timeout_ms = 11;
}
message Predecessor
{
    chronolog.v1.KeeperRef keeper = 1;
    string instance = 2;
    uint64 epoch = 3;
    chronolog.v1.Hlc own_cut = 4;
    int64 own_physical_ceiling_ns = 5;
}
message SettlementProof
{
    string instance = 1;
    chronolog.v1.Hlc coverage_start = 2;
    chronolog.v1.Hlc settled_through = 3;
    chronolog.v1.Hlc first_event = 4;
}
message ExtendCeilingRequest
{
    string process_id = 1;
    string instance = 2;
    uint64 applied_route_revision = 3;
    chronolog.v1.Hlc wanted_hlc = 4;
    int64 realtime_ns = 5;
}
message ExtendCeilingResponse
{
    chronolog.v1.ItemStatus status = 1;
    chronolog.v1.Hlc ceiling = 2;
    int64 physical_ceiling_ns = 3;
    repeated RouteUpdate routes = 4;
    uint64 fence_revision = 5;
}
// KeeperRequest and MembershipResponse are the replicated MembershipCommand operand and apply result;
// each Cluster RPC has its own messages with the same field numbers.
message KeeperRequest { string process_id = 1; }
message MembershipResponse
{
    chronolog.v1.ItemStatus status = 1;
    repeated MemberState members = 2;
    repeated RouteUpdate routes = 3;
}
message DrainKeeperRequest { string process_id = 1; }
message DrainKeeperResponse
{
    chronolog.v1.ItemStatus status = 1;
    repeated MemberState members = 2;
    repeated RouteUpdate routes = 3;
}
message JoinKeeperRequest { string process_id = 1; }
message JoinKeeperResponse
{
    chronolog.v1.ItemStatus status = 1;
    repeated MemberState members = 2;
    repeated RouteUpdate routes = 3;
}
message AbandonKeeperRequest { string process_id = 1; }
message AbandonKeeperResponse
{
    chronolog.v1.ItemStatus status = 1;
    repeated MemberState members = 2;
    repeated RouteUpdate routes = 3;
}
message ListMembersRequest {}
message ListMembersResponse
{
    chronolog.v1.ItemStatus status = 1;
    repeated MemberState members = 2;
    repeated RouteUpdate routes = 3;
}
message InstanceState
{
    string instance = 1;
    chronolog.v1.Hlc ceiling = 2;
    int64 physical_ceiling_ns = 3;
    bool granted = 4;
    repeated InstanceProof proofs = 5;
}
message InstanceProof
{
    uint64 story_id = 1;
    SettlementProof proof = 2;
}
message MemberState
{
    Process process = 1;
    repeated InstanceState instances = 2;
    uint64 fence_revision = 3;
    bool joined = 4;
    uint64 policy_version = 5;
    uint64 applied_route_revision = 6;
}
message MembershipState
{
    repeated RouteUpdate route_history = 4;
    uint64 route_history_floor = 6;
    uint64 revision = 5;
    repeated MemberState members = 1;
    repeated RouteUpdate routes = 2;
    MembershipPolicy policy = 3;
}
message AppliedRouteRevision
{
    string process_id = 1;
    string instance = 2;
    uint64 revision = 3;
}
message MembershipCommand
{
    repeated AppliedRouteRevision applied_routes = 7;
    oneof operation
    {
        RegisterRequest register = 1;
        HeartbeatRequest heartbeat = 2;
        ExtendCeilingRequest extend = 3;
        KeeperRequest drain = 4;
        KeeperRequest join = 5;
        KeeperRequest abandon = 6;
    }
}
