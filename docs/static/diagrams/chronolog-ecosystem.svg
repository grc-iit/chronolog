<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Outer halo: stacked concentric rings that fade outward (ecosystem field) -->
  <g fill="none" stroke="#c3e04d" stroke-width="1.5">
    <circle cx="360" cy="310" r="130" stroke-opacity="0.50"/>
    <circle cx="360" cy="310" r="155" stroke-opacity="0.40"/>
    <circle cx="360" cy="310" r="180" stroke-opacity="0.32"/>
    <circle cx="360" cy="310" r="205" stroke-opacity="0.24"/>
    <circle cx="360" cy="310" r="230" stroke-opacity="0.18"/>
    <circle cx="360" cy="310" r="260" stroke-opacity="0.12"/>
    <circle cx="360" cy="310" r="290" stroke-opacity="0.07"/>
  </g>

  <!-- ===================== Connection lines: hub rim -> plugin edges ===================== -->
  <g stroke="#c3e04d" stroke-width="1.4" stroke-opacity="0.75" stroke-linecap="round">
    <line x1="360" y1="200" x2="360" y2="120"/>
    <line x1="455" y1="255" x2="490" y2="206"/>
    <line x1="455" y1="365" x2="490" y2="414"/>
    <line x1="360" y1="420" x2="360" y2="500"/>
    <line x1="265" y1="365" x2="230" y2="414"/>
    <line x1="265" y1="255" x2="230" y2="206"/>
  </g>

  <!-- ===================== Central hub ===================== -->
  <circle cx="360" cy="310" r="110" fill="none" stroke="#c3e04d" stroke-width="1.25" stroke-opacity="0.55"/>
  <circle cx="360" cy="310" r="90"  fill="#1e222b" stroke="#c3e04d" stroke-width="2"/>

  <!-- Hub label -->
  <text x="360" y="296" text-anchor="middle" fill="#c3e04d" font-size="22" font-weight="700" letter-spacing="0.5">ChronoLog</text>
  <text x="360" y="320" text-anchor="middle" fill="#9ca3b0" font-size="10" letter-spacing="1.5" font-weight="600">DISTRIBUTED LOG STORE</text>
  <text x="360" y="338" text-anchor="middle" fill="#9ca3b0" font-size="10" letter-spacing="0.5">tiered · time-ordered</text>

  <!-- ===================== Plugin nodes (6, hexagonal, dark fill) ===================== -->

  <!-- Top: ChronoSQL -->
  <g>
    <rect x="280" y="60" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="360" y="86" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoSQL</text>
    <text x="360" y="104" text-anchor="middle" fill="#9ca3b0" font-size="10">SQL queries</text>
  </g>

  <!-- Top-right: ChronoKVS -->
  <g>
    <rect x="490" y="170" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="570" y="196" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoKVS</text>
    <text x="570" y="214" text-anchor="middle" fill="#9ca3b0" font-size="10">Key-value store</text>
  </g>

  <!-- Bottom-right: ChronoStream -->
  <g>
    <rect x="490" y="390" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="570" y="416" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoStream</text>
    <text x="570" y="434" text-anchor="middle" fill="#9ca3b0" font-size="10">Stream processing</text>
  </g>

  <!-- Bottom: ChronoPubSub -->
  <g>
    <rect x="280" y="500" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="360" y="526" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoPubSub</text>
    <text x="360" y="544" text-anchor="middle" fill="#9ca3b0" font-size="10">Pub / sub messaging</text>
  </g>

  <!-- Bottom-left: ChronoMCP -->
  <g>
    <rect x="70" y="390" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="150" y="416" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoMCP</text>
    <text x="150" y="434" text-anchor="middle" fill="#9ca3b0" font-size="10">LLM integration</text>
  </g>

  <!-- Top-left: ChronoViz -->
  <g>
    <rect x="70" y="170" width="160" height="60" rx="10" fill="#1e222b" stroke="#c3e04d" stroke-width="1.5"/>
    <text x="150" y="196" text-anchor="middle" fill="#c3e04d" font-size="14" font-weight="600">ChronoViz</text>
    <text x="150" y="214" text-anchor="middle" fill="#9ca3b0" font-size="10">Grafana plugin</text>
  </g>

  <!-- Caption -->
  <text x="360" y="600" text-anchor="middle" fill="#6b7280" font-size="11" letter-spacing="2" font-weight="600">EXTENSIBLE BY DESIGN</text>
</svg>
