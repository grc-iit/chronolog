services:
  typescript-tests:
    image: node:22.23.0-trixie-slim
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [chronolog]
    extra_hosts:
      - "chrono-visor:${CHRONOLOG_NET_PREFIX:-10.231.77}.201"
      - "chrono-player:${CHRONOLOG_NET_PREFIX:-10.231.77}.204"
    working_dir: /package
    volumes:
      - ${CHRONOLOG_TYPESCRIPT_PACKAGE}:/package:ro
    environment:
      GRPC_DNS_RESOLVER: native
      RES_OPTIONS: "single-request-reopen timeout:1 attempts:2"
      CHRONOLOG_TYPESCRIPT_CATALOG: chrono-visor:50051
      CHRONOLOG_TYPESCRIPT_PLAYER: chrono-player:50054
    command: ["node", "--test", "--test-timeout=60000", "test/client.test.js"]
