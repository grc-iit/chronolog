[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chronolog-viz"
version = "4.0.0"
requires-python = ">=3.12"
dependencies = ["chronolog>=4,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[tool.hatch.build.targets.wheel]
only-include = ["chronolog_viz.py"]
