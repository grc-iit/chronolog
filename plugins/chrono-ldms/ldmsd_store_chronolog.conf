# ldmsd configuration: store LDMS sets in ChronoLog through store_chronolog.
# Needs libstore_chronolog.so on LDMSD_PLUGIN_LIBPATH and libchronolog_ldms_bridge.so plus
# libchronolog_client.so on LD_LIBRARY_PATH. Read the samples back with chronolog_ldms_example.

load name=meminfo
config name=meminfo producer=node1 instance=node1/meminfo schema=meminfo
start name=meminfo interval=1000000 offset=0

load name=store_chronolog
config name=store_chronolog catalog=127.0.0.1:50051 player=127.0.0.1:50054 queue=8192 batch=128 flush_ms=100 durability=durable

# container is the chronicle; every matched producer gets the story <schema>_<producer>.
strgp_add name=chronolog_meminfo plugin=store_chronolog container=ldms schema=meminfo
strgp_prdcr_add name=chronolog_meminfo regex=.*
strgp_start name=chronolog_meminfo
