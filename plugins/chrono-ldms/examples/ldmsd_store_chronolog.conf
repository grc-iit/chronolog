# ldmsd configuration example: store LDMS metric sets into ChronoLog via
# the store_chronolog plugin.
#
# Run with an ldmsd that can find both libstore_chronolog.so (on
# LDMSD_PLUGIN_LIBPATH) and the ChronoLog client library it links against
# (on LD_LIBRARY_PATH), against a running ChronoLog deployment (ChronoVisor +
# keeper(s) + grapher). For example:
#
#   export LDMSD_PLUGIN_LIBPATH=$HOME/chronolog-install/chronolog/lib:$LDMSD_PLUGIN_LIBPATH
#   export LD_LIBRARY_PATH=$HOME/chronolog-install/chronolog/lib:$LD_LIBRARY_PATH
#   ldmsd -x sock:10001 -c ldmsd_store_chronolog.conf -l /tmp/ldmsd.log -v INFO
#
# Then tail the stored samples back with:
#   chrono-ldms-example-tail-reader -c <chrono-client-conf.json> ldms meminfo 10

# ---- a sampler producing metric sets (meminfo here) --------------------------
load name=meminfo
config name=meminfo producer=node1 instance=node1/meminfo schema=meminfo
start name=meminfo interval=1000000 offset=0

# ---- the ChronoLog store plugin ---------------------------------------------
load name=store_chronolog
# client_conf is optional; omit it to use the ChronoLog client defaults
# (ChronoVisor portal at 127.0.0.1:5555).
config name=store_chronolog client_conf=/path/to/chronolog-install/chronolog/conf/chrono-client-conf.json

# ---- storage policy: which sets go to which Chronicle/Story ------------------
# container -> ChronoLog Chronicle, schema -> ChronoLog Story.
strgp_add name=chronolog_meminfo plugin=store_chronolog container=ldms schema=meminfo
strgp_prdcr_add name=chronolog_meminfo regex=.*
strgp_start name=chronolog_meminfo
